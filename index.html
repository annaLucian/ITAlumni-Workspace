<!doctype html>
<html lang="ca">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ITAlumni</title>
        <link rel="icon" type="image/png" href="./public/assets/favicon.png" />
        <link rel="stylesheet" href="./src/styles/global.css" />
    </head>
    <body>
        <header class="header">
            <div class="header__container">
                <nav class="header__nav header__nav--left">
                    <div class="header__logo">
                        <img src="./public/assets/logo/logo-alumni.svg" alt="ITAlumni logo" class="header__logo-img" />
                        <span class="header__logo-text">LUMNI</span>
                    </div>
                    <ul class="header__menu">
                        <li class="header__item"><a href="#inici" class="header__link">Inici</a></li>
                        <li class="header__item"><a href="#xarxa" class="header__link">Xarxa</a></li>
                        <li class="header__item">
                            <a href="#feina" class="header__link">Oportunitats de feina</a>
                        </li>
                    </ul>
                </nav>
                <nav class="header__nav header__nav--right">
                    <a href="#register" class="btn__header btn--outline">
                        <img src="./public/assets/icons/icon-email-nav.svg" alt="" class="btn__icon" />
                        Apunta’t</a
                    >
                    <a href="#feedback" class="btn__header btn--gradient">
                        <img src="./public/assets/icons/icon-user-nav.svg" alt="" class="btn__icon" />
                        Com et veuen?</a
                    >
                </nav>
            </div>
        </header>
        <main class="app"></main>
        <footer class="footer">
            <div class="footer__top">
                <p class="footer__title">"No et perdis res, subscriu-<br />te!" </p>
                <form class="footer__form">
                    <div class="form__group">
                        <img src="./public/assets/icons/icon-email-footer.svg" alt="" class="form__icon" />
                        <input
                            type="email"
                            autocomplete="email"
                            name="email"
                            required
                            placeholder="El teu email"
                            class="form__input"
                        />
                    </div>
                    <button type="submit" class="footer__btn btn--gradient">Subscriu-te</button>
                </form>
            </div>
            <div class="footer__middle">
                <div class="table-footer-group">
                    <img src="./public/assets/logo/logo-alumni.svg" alt="logo alumni" class="footer__brand-ing" />
                    <span class="footer__brand-text">LUMNI</span>
                </div>
                <ul class="footer__menu">
                    <li><a href="" class="footer__link">Sobre nosaltres</a></li>
                    <li class="footer__item"><a href="#" class="footer__link">Funcionalitats</a></li>
                    <li class="footer__item"><a href="#" class="footer__link">Centre d'ajuda</a></li>
                    <li class="footer__item"><a href="#" class="footer__link">Contacta'ns</a></li>
                    <li class="footer__item"><a href="#" class="footer__link">FAQs</a></li>
                    <li class="footer__item"><a href="#" class="footer__link">Oportunitats laborals</a></li>
                </ul>
            </div>
            <div class="footer__bottom">
                <div class="footer__bottom-row">
                    <div class="select-wrapper">
                        <select class="footer__select" name="language">
                            <option value="ca">Català</option>
                            <option value="es">Castellano</option>
                            <option value="en">Ingles</option>
                        </select>
                        <img src="./public/assets/icons/icon-arrow-down.svg" alt="" class="select-arrow" />
                    </div>

                    <div class="footer__copyright">
                        <p>© 2024 Brand, Inc. • Privadesa • Termes d'ús <br />• Mapa del lloc</p>
                    </div>
                    <div class="footer__socials">
                        <a href="#" target="_blank"> <img src="./public/assets/icons/icon-fb.svg" alt="Facebook" /></a>
                        <a href="#" target="_blank"
                            ><img src="./public/assets/icons/icon-linkedin.svg" alt="Linkedin"
                        /></a>
                        <a href="#" target="_blank"
                            ><img src="./public/assets/icons/icon-youtube.svg" alt="Youtube"
                        /></a>
                    </div>
                </div>
            </div>
        </footer>
        <script type="module" src="./dist/main.js"></script>
    </body>
</html>
