<!doctype html>
<html lang="ca">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Treball | ITAlumni</title>
        <link rel="icon" type="image/png" href="/public/assets/favicon.png" />
        <link rel="stylesheet" href="../styles/global.css" />
    </head>
    <body class="jobs-page">
        <header class="jobs-header">
            <a href="./dashboard.html" class="jobs-header--mobile" aria-label="Tornar al perfil">
                <img src="/public/assets/icons/networking/arrow-left.svg" alt="" aria-label="true" />
            </a>
            <nav class="jobs-header__nav" aria-label="navegació principal">
                <div class="jobs-header__brand">
                    <img
                        src="/public/assets/icons/dashboard/logo-dashboard.svg"
                        alt="logo ITAlumni"
                        class="jobs-header__logo"
                    />
                    <span class="jobs-header__title">Alumni Connect</span>
                </div>
                <ul class="jobs-header__menu">
                    <li class="jobs-header__menu-item">
                        <a href="./dashboard.html" class="jobs-header__menu-link jobs-header__menu-link--active"
                            >Inici</a
                        >
                    </li>
                    <li class="jobs-header__menu-item">
                        <a href="./networking.html" class="jobs-header__menu-link">Xarxa</a>
                    </li>
                    <li class="jobs-header__menu-item--mobile">
                        <a href="./jobs.html" class="jobs-header__menu-link">Oportunitats de feina</a>
                    </li>
                </ul>
            </nav>
            <nav class="jobs-header_wraper" aria-label="Opcions d' usuari">
                <div class="jobs-header-actions">
                    <button type="button" class="jobs-header__action-btn--desktop" aria-label="Obrir cerca">
                        <img src="/public/assets/icons/dashboard/icon-dashboard-search.svg" alt="" aria-hidden="true" />
                    </button>
                    <button type="button" class="jobs-header__action-btn--desktop" aria-label="Notificacions">
                        <img
                            src="/public/assets/icons/dashboard/icon-dashboard-notification.svg"
                            alt=""
                            aria-hidden="true"
                        />
                    </button>
                    <button type="button" class="jobs-header__action-btn--desktop" aria-label="Configuració">
                        <img
                            src="/public/assets/icons/dashboard/icon-dashboard-setting.svg"
                            alt=""
                            aria-hidden="true"
                        />
                    </button>
                    <button type="button" class="jobs-header__action-btn" aria-label="Accessibilitat">
                        <img
                            src="/public/assets/icons/dashboard/dashboard-mobile/icon-dashboard-access.svg"
                            alt=""
                            aria-hidden="true"
                        />
                    </button>
                    <button type="button" class="jobs-header__profile-btn" aria-label="Perfil d'usuari">
                        <img
                            src="/public/assets/images/dashboard/dashboard-avatar.svg"
                            alt=""
                            aria-hidden="true"
                            class="jobs-header__avatar"
                        />
                    </button>
                </div>
            </nav>
        </header>
        <section class="jobs-welcome" aria-labelledby="jobs-welcome-title">
            <div class="jobs-welcome__search">
                <img
                    src="/public/assets/icons/dashboard/icon-dashboard-search.svg"
                    alt=""
                    aria-hidden="true"
                    class="jobs-search__icon"
                />
                <input
                    type="search"
                    class="jobs-welcome__input"
                    placeholder="Cercar exalumnes..."
                    aria-label="Cercar exalumnes"
                />
            </div>

            <div class="jobs-welcome__filters" aria-label="Filtres de cerca">
                <div class="jobs-filters__group" role="tablist">
                    <button type="button" class="jobs-filters__btn" role="tab" aria-selected="false">
                        <img src="/public/assets/icons/jobs/icon-jobs-filter.svg" alt="" aria-hidden="true" />
                        <span class="jobs-filters__text">Indústria</span>
                        <img src="/public/assets/icons/home/icon-arrow-down.svg" alt="" aria-hidden="true" />
                    </button>
                    <button type="button" class="jobs-filters__btn" role="tab" aria-selected="true">
                        <img src="/public/assets/icons/jobs/icon-jobs-filter.svg" alt="" aria-hidden="true" />
                        <span class="jobs-filters__text">Nivell d'experiència</span>
                        <img src="/public/assets/icons/home/icon-arrow-down.svg" alt="" aria-hidden="true" />
                    </button>
                    <button
                        type="button"
                        class="jobs-filters__btn jobs-filters__btn--tablet"
                        role="tab"
                        aria-selected="false"
                    >
                        <span class="jobs-filters__text">Data de publicació</span>
                        <img src="/public/assets/icons/home/icon-arrow-down.svg" alt="" aria-hidden="true" />
                    </button>
                    <button
                        type="button"
                        class="jobs-filters__btn jobs-filters__btn--desktop"
                        role="tab"
                        aria-selected="false"
                    >
                        <span class="jobs-filters__text">Menys de 10 sol·licitants</span>
                    </button>
                    <button
                        type="button"
                        class="jobs-filters__btn jobs-filters__btn--desktop jobs-filters__btn--active"
                        role="tab"
                        aria-selected="false"
                    >
                        <span class="jobs-filters__text">Més informació</span>
                        <img
                            src="/public/assets/icons/jobs/icon-jobs-down.png"
                            alt=""
                            aria-hidden="true"
                            class="job-filters__icon--active"
                        />
                    </button>
                </div>
            </div>
        </section>

        <footer class="footer-jobs">
            <nav class="bottom-jobs-nav" saria-label="Navegació inferior per a mòbil">
                <ul class="bottom-jobs-nav__list">
                    <li class="bottom-jobs-nav__item">
                        <a href="./dashboard.html" class="bottom-jobs-nav__link">
                            <img
                                src="/public/assets/icons/networking/home.svg"
                                alt=""
                                aria-hidden="true"
                                class="bottom-jobs-nav__icon"
                            />
                            <span class="bottom-nav-jobs__label">Inici</span>
                        </a>
                    </li>
                    <li class="bottom-jobs-nav__item">
                        <a href="./networking.html" class="bottom-jobs-nav__link bottom-nav__link">
                            <img
                                src="/public/assets/icons/jobs/icon-jobs-networking.svg"
                                alt=""
                                aria-hidden="true"
                                class="bottom-jobs-nav__icon"
                            />
                            <span class="bottom-jobs-nav__label">Xarxa</span>
                        </a>
                    </li>
                    <li class="bottom-jobs-nav__item">
                        <a href="./jobs.html" class="bottom-jobs-nav__link bottom-nav__link--active">
                            <img
                                src="/public/assets/icons/jobs/icon-jobs-feina.svg"
                                alt=""
                                aria-hidden="true"
                                class="bottom-jobs-nav__icon"
                            />
                            <span class="bottom-jobs-nav__label">Portal feina</span>
                        </a>
                    </li>
                    <li class="bottom-jobs-nav__item">
                        <a href="./profile.html" class="bottom-jobs-nav__link">
                            <img
                                src="/public/assets/icons/dashboard/dashboard-mobile/iconm-dashboard-profile.svg"
                                alt=""
                                aria-hidden="true"
                                class="bottom-jobs-nav__icon"
                            />
                            <span class="bottom-jobs-nav__label">Perfil</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="footer-jobs__bottom">
                <div class="footer-jobs__bottom-row">
                    <div class="select-jobs-wrapper">
                        <select class="footer-jobs__select" name="language">
                            <option value="ca">Català</option>
                            <option value="es">Castellano</option>
                            <option value="en">Ingles</option>
                        </select>
                        <img src="/public/assets/icons/home/icon-arrow-down.svg" alt="" class="select-jobs-arrow" />
                    </div>

                    <div class="footer-jobs__copyright">
                        <p>© 2024 Brand, Inc. • Privadesa • Termes d'ús <br />• Mapa del lloc</p>
                    </div>
                    <div class="footer-jobs__policy">
                        <a href="./privacy.html" class="footer-jobs__link"> Privacy Policy </a>
                    </div>
                </div>
            </div>
        </footer>
    </body>
</html>
